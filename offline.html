<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Quest</title>
<meta name="theme-color" content="#14123a">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
    background: #14123a; color: #fff; font-family: ui-rounded, "Segoe UI", system-ui, sans-serif; font-weight: 700; padding: 24px; }
  .pip { font-size: 6rem; }
  .bubble { background: #fff; color: #1b1850; border-radius: 26px; padding: 10px 24px; font-size: 2.2rem; display: inline-block; margin: 12px 0; }
  p { font-weight: 600; max-width: 28ch; margin: 12px auto; line-height: 1.4; }
  a { display: inline-block; min-height: 64px; padding: 14px 30px; border-radius: 20px; background: #ffd23f; color: #2a1d00;
      font-size: 1.6rem; text-decoration: none; box-shadow: 0 6px 0 #b88f00; }
</style>
</head>
<body>
  <main>
    <div class="pip">🦊</div>
    <div class="bubble">📶 ❌</div>
    <p>Math Quest is not saved on this device yet. Connect to the internet once to download it.</p>
    <a href="./" aria-label="Try again">🔁</a>
  </main>
</body>
</html>
